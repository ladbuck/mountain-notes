<title>Mountain Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
/* Layout: one-screen app. Library = shelf of cloth-bound notebooks with folders and search; Editor = top bar, tool rail, then 1–3 note panes split by draggable dividers. */
:root{
  --bg:#eceef3; --surface:#ffffff; --surface-2:#f4f5f8; --fg:#1a1f2c; --muted:#5f677c; --line:#d8dbe4;
  --accent:#2a54d6; --accent-soft:#e3eaff; --accent-ink:#ffffff; --stage:#dcdfe7; --danger:#c3352d; --ok:#1d7f4e;
  --shadow:0 1px 2px rgba(20,26,40,.08),0 6px 18px rgba(20,26,40,.10);
  --font-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Young Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151b; --surface:#1c1f28; --surface-2:#252935; --fg:#e8eaf1; --muted:#9ba2b6; --line:#323747;
  --accent:#86a2ff; --accent-soft:#25304f; --accent-ink:#0d1222; --stage:#0d0f14; --danger:#ff7a70; --ok:#5fd39a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151b; --surface:#1c1f28; --surface-2:#252935; --fg:#e8eaf1; --muted:#9ba2b6; --line:#323747;
  --accent:#86a2ff; --accent-soft:#25304f; --accent-ink:#0d1222; --stage:#0d0f14; --danger:#ff7a70; --ok:#5fd39a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}

[hidden]{display:none!important}
.topbar,.rail,.phead,#menu .row,#menu .rowbtn,.selbar,#lnav,.hbar,.lt,.lbar,.lpop,.doc .ft,.doc .th{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- Library ---------- */
#library{overflow:hidden}
.lib-wrap{max-width:1180px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:34px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn .icon{width:18px;height:18px}
.btn.small{min-height:34px;padding:6px 10px;font-size:13.5px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.syncdot.ok{background:var(--ok)}.syncdot.busy{background:#e0a100}.syncdot.err{background:var(--danger)}
.libbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:10px 0}
.search .icon{width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{opacity:.65;font-variant-numeric:tabular-nums}
.chip.add{border-style:dashed;color:var(--muted)}
.shelf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.shelf-label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.cover{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:4px 10px 10px 4px;border:0;padding:18px 14px 14px 26px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:12px;background:rgba(0,0,0,.22)}
.cover::after{content:"";position:absolute;left:12px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
.cover .ct{font-family:var(--font-display);font-size:19px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere;position:relative}
.cover .label{position:relative;align-self:flex-start;background:rgba(255,255,255,.9);color:#1a1f2c;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px}
.cover .hitline{position:relative;font-size:12px;line-height:1.35;background:rgba(0,0,0,.28);border-radius:6px;padding:6px 8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cover:hover{transform:translateY(-2px)}
.pick{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#1a1f2c;display:none;place-items:center;font-weight:600;font-size:14px;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.selecting .pick{display:grid}
.card.picked .cover{outline:3px solid var(--accent);outline-offset:3px}
.card.picked .pick{background:var(--accent);color:var(--accent-ink)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.meta span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .mini{display:flex;gap:0}
.selecting .mini{visibility:hidden}
.iconbtn{display:inline-grid;place-items:center;min-width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--fg);padding:0 8px;gap:6px}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.mini .iconbtn{min-width:30px;height:32px;padding:0 5px}
.mini .icon{width:17px;height:17px}
.splitbar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:var(--shadow);z-index:2}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--muted)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tip b{font-weight:600}
.tip span{color:var(--muted);font-size:14px;line-height:1.45}

/* ---------- Editor ---------- */
#editor{position:relative}
.topbar{display:flex;align-items:center;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px;min-width:0}
#docTitle{flex:1 1 120px;min-width:60px;border:0;background:transparent;font-family:var(--font-display);font-size:18px;padding:6px 8px;border-radius:8px;text-overflow:ellipsis}
#docTitle:hover,#docTitle:focus{background:var(--surface-2);outline:none}
.zoomgrp{display:flex;align-items:center}
#zoomLbl{min-width:52px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);border:0;background:transparent;height:40px;border-radius:8px}
.rail{display:flex;align-items:center;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:4px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .iconbtn{min-width:44px;height:44px;flex:none}
.sep{width:1px;height:28px;background:var(--line);margin:0 6px;flex:none}
.ctx{display:flex;align-items:center;gap:4px;flex:none}
.ctx .hint{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;display:grid;place-items:center;background:transparent}
.sw i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw.custom{position:relative;overflow:hidden}
.sw.custom i{background:conic-gradient(#f33,#fd0,#3c6,#39f,#a4f,#f33)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sz{width:34px;height:34px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.sz i{display:block;border-radius:50%;background:var(--fg)}
.sz[aria-pressed="true"]{background:var(--accent-soft)}
.sz[aria-pressed="true"] i{background:var(--accent)}
.szr{display:flex;align-items:center;gap:6px;padding:0 4px;flex:none}
.szr input{width:118px;accent-color:var(--accent);touch-action:none;margin:0;height:30px}
.szr output{min-width:30px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
.rail.vert .szr{display:none}
.sizetop{width:auto;min-width:44px;padding:0 8px;gap:6px;display:inline-flex;align-items:center;justify-content:center}
.sizetop i{display:block;border-radius:50%;background:var(--fg);flex:none}
.sizetop b{font-weight:500;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:18px;text-align:left}
.szpop{position:fixed;z-index:9000;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:12px 14px;width:min(300px,calc(100vw - 16px));display:flex;flex-direction:column;gap:10px}
.szpop .seg{align-self:stretch;display:flex}.szpop .seg button{flex:1}
.szpop .szrow{display:flex;align-items:center;gap:10px}
.szpop input[type=range]{flex:1;accent-color:var(--accent);touch-action:none;height:34px;margin:0}
.szpop output{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.szpop .szprev{height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.szpop .szpre{display:flex;gap:6px;flex-wrap:wrap}.szpop .szpre button{flex:1;min-width:0}
.rail.vert .szr .szw{position:relative;width:34px;height:124px}
.rail.vert .szr input{position:absolute;left:50%;top:50%;width:118px;transform:translate(-50%,-50%) rotate(-90deg)}
.fav{width:34px;height:34px;border:2px solid transparent;border-radius:50%;background:transparent;padding:0;display:grid;place-items:center;flex:none}
.fav i{display:block;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.fav.hl i{border-radius:4px}
.fav.fade i{outline:2px dotted currentColor;outline-offset:2px}
.fav[aria-pressed="true"]{border-color:var(--accent)}
.exitp{display:none}

/* tool bar docking: top / bottom / left / right / floating */
#body{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#body.dock-bottom{flex-direction:column-reverse}
#body.dock-left{flex-direction:row}
#body.dock-right{flex-direction:row-reverse}
#body.dock-bottom .rail{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.rail.vert{flex-direction:column;flex:none;width:64px;overflow-x:hidden;overflow-y:auto;padding:6px 4px;border-bottom:0}
#body.dock-left .rail{border-right:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px))}
#body.dock-right .rail{border-left:1px solid var(--line);padding-right:max(4px,env(safe-area-inset-right,0px))}
.rail.vert .sep{width:30px;height:1px;margin:6px 0}
.rail.vert .ctx,.rail.vert .seg{flex-direction:column}
.rail.vert .seg button{font-size:11px;padding:6px 4px;white-space:normal;line-height:1.2}
.rail.vert .btn.small{font-size:11px;line-height:1.2;padding:6px 4px;width:56px;min-height:0;justify-content:center;text-align:center;white-space:normal}
.rail.vert .hint{display:none}
#body.dock-float .rail{position:absolute;z-index:12;box-sizing:border-box;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:max-content;max-width:min(600px,calc(100% - 16px));flex-wrap:wrap;overflow:visible;padding:6px;row-gap:4px}
#body.dock-float .rail .hint{display:none}
.rail .grip{cursor:grab;touch-action:none;color:var(--muted);min-width:36px}
.rail.dragging{opacity:.93;box-shadow:0 12px 32px rgba(10,14,24,.28)}
.rail.dragging .grip{cursor:grabbing}
#dockGhost{position:absolute;z-index:11;background:var(--accent-soft);border:2px dashed var(--accent);border-radius:12px;opacity:.9;pointer-events:none}
#dockGhost.top{left:8px;right:8px;top:4px;height:52px}
#dockGhost.bottom{left:8px;right:8px;bottom:4px;height:52px}
#dockGhost.left{top:8px;bottom:8px;left:4px;width:64px}
#dockGhost.right{top:8px;bottom:8px;right:4px;width:64px}

/* chalkboard */
.pane.chalk .sheet{background:#21302a}
.pane.chalk .frame{filter:invert(.92) hue-rotate(180deg)}
.pane.chalk .extra{background-color:#21302a;border-top-color:rgba(255,255,255,.18)}
.pane.chalk .extra.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(255,255,255,.10) 35px 36px)}
.pane.chalk .extra.grid{background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px)}
.pane.chalk .extra.dots{background-image:radial-gradient(rgba(255,255,255,.22) 1.3px,transparent 1.6px)}
.pane.chalk .tx.editing{background:rgba(20,30,26,.88)}
.pane.droptarget .vp{outline:3px dashed var(--accent);outline-offset:-3px}
/* watermark */
.brandmark{position:absolute;z-index:4;pointer-events:none;display:flex;align-items:center;gap:8px;font:600 18px/1.1 var(--font-ui);color:#1a1f2c;text-shadow:0 0 3px rgba(255,255,255,.9);max-width:45%}
.brandmark img{max-height:44px;max-width:140px;display:block}
.brandmark.br{right:14px;bottom:14px}.brandmark.bl{left:14px;bottom:14px}.brandmark.tr{right:14px;top:14px}.brandmark.tl{left:14px;top:14px}
.brandmark.c{left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;max-width:80%;flex-direction:column}
.brandmark.c img{max-height:160px;max-width:320px}
.pane.chalk .brandmark{color:#f5f3ea;text-shadow:0 0 3px rgba(0,0,0,.7)}
/* timer */
#timer{position:absolute;z-index:13;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:200px}
.tm-time{font:600 42px/1 var(--font-ui);font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;padding:4px 12px;user-select:none;-webkit-user-select:none}
#timer.done .tm-time{color:var(--danger);animation:tmflash 1s steps(2) infinite}
@keyframes tmflash{50%{opacity:.3}}
.tm-btns{display:flex;gap:6px;align-items:center}
.tm-pre{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:240px}
.tm-pre button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 9px;font-size:12.5px;font-weight:500}
#timer.ro .tm-btns,#timer.ro .tm-pre{display:none}
/* live */
.livebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:10px 12px 10px 16px}
.livebar>span:nth-child(2){flex:1;min-width:0}
.livedot{width:10px;height:10px;border-radius:50%;background:#e5372c;flex:none;animation:tmflash 1.6s ease-in-out infinite}
.livepill{border:0;background:#d12c2c;color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
body.watching .rail,body.watching #swapBtn,body.watching #splitBtn,body.watching #menuBtn,body.watching #dirBtn,body.watching #linkBtn{display:none!important}
body:not(.watching) #followBtn{display:none!important}
/* elements, customize, graph, ask */
.elgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.elc{position:relative;min-width:0}
.elbtn{border:1px solid var(--line);background:#fff;color:#1a1f2c;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;width:100%;min-width:0}
.elbtn:hover{border-color:var(--accent)}
.elbtn img{width:100%;height:84px;object-fit:contain}
.elbtn span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elc .iconbtn{position:absolute;top:2px;right:2px;min-width:28px;height:28px;background:var(--surface)}
.clist{display:flex;flex-direction:column;gap:2px;max-height:55vh;overflow:auto}
.crow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:10px}
.crow:hover{background:var(--surface-2)}
.crow .nm{flex:1;min-width:0}
.crow .iconbtn{min-width:34px;height:34px}
.toggle:disabled{opacity:.45;cursor:default}
.gform{display:flex;flex-direction:column;gap:8px}
.grow{display:flex;align-items:center;gap:8px}
.grow b{font-family:'Cambria Math',Georgia,serif;font-weight:400;font-size:17px;white-space:nowrap}
.grow input{flex:1;min-width:0}
.grow .gsw{width:14px;height:14px;border-radius:50%;flex:none}
.granges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.granges label{font-size:12.5px}
.granges .pair{display:flex;gap:6px}
.granges .pair input{width:100%;min-width:0}
.gtsel{width:auto;flex:none;padding:4px 2px;font-family:'Cambria Math',Georgia,serif;font-size:16px}
.gform [hidden]{display:none!important}
.pdfform{display:flex;flex-direction:column;gap:10px}
.pdfcols{display:flex;gap:16px;flex-wrap:wrap}
.pdfopts{display:flex;flex-direction:column;gap:9px;flex:1 1 250px;min-width:0}
.pdfopts label{font-size:12.5px}.pdfopts select{width:100%}
.pdfopts [hidden]{display:none!important}
.pmc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end}.pmc input{width:100%;min-width:0}.pmc small{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.pdfprev{flex:0 0 160px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.ppage{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid #d8dce6;transition:width .15s,height .15s}
.pbox{position:absolute;border:1px dashed #7d93c4;background:#f2f5fb;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 8%;box-sizing:border-box;overflow:hidden}
.pbox i{display:block;height:3px;border-radius:2px;background:#c3cde3}.pbox i:nth-child(2n){width:72%}
.phdr{position:absolute;left:12%;right:12%;height:3px;background:#b7bfd0;border-radius:2px}
.pnum{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:8px;color:#7a8296}
.pcount{font-size:12.5px;color:var(--muted)}
.pdfprog{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:var(--panel,#fff);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;min-width:260px}

.tgrid th.ch{position:sticky}.tgrid th.on{background:#cfdcfb;color:#2a54d6}
.tgrid th.corner{cursor:pointer;font-size:10px;color:#9aa3b5;touch-action:none}

.tgrid tr{vertical-align:top}.tgrid td input{height:100%}
.tgrid td.vm{vertical-align:middle}.tgrid td.vb{vertical-align:bottom}
.tgrid td.h{background:#f1f4fb}
.tgrid input{width:100%;border:0;background:transparent;padding:7px 8px;font:inherit;color:#1a1f2c;min-width:90px;border-radius:0}

.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* arranging the tool bar */
.rail.editing{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}

.hp-head{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}

</style></head><body><div class="page">
<p class="eyebrow">Class 10 · Science · Light (sample note)</p>
<h1>Refraction of Light</h1>
<p class="lede">When light passes from one transparent medium into another, its speed changes. If it enters at an angle, its direction changes too. This bending of light is called <b>refraction</b>. Jump to the <a href="#example">worked example</a>.</p>

<h2 id="why">Why does light bend?</h2>
<p>Light travels fastest in a vacuum, about 3 × 10<sup>8</sup> m/s. In optically denser media such as water and glass it slows down. When a beam meets the boundary at an angle, one edge of the beam slows first, so the whole beam turns.</p>
<svg width="520" height="300" viewBox="0 0 520 300" font-family="system-ui,sans-serif" font-size="14">
  <rect x="0" y="150" width="520" height="150" fill="#e7f0ff"/>
  <line x1="0" y1="150" x2="520" y2="150" stroke="#5b6b8c" stroke-width="2"/>
  <line x1="260" y1="20" x2="260" y2="290" stroke="#8a96ad" stroke-dasharray="6 6"/>
  <line x1="130" y1="30" x2="260" y2="150" stroke="#d1462f" stroke-width="3"/>
  <line x1="260" y1="150" x2="320" y2="290" stroke="#d1462f" stroke-width="3"/>
  <path d="M190 85 l10 0 l-3 9" fill="none" stroke="#d1462f" stroke-width="2.5"/>
  <text x="20" y="40" fill="#1d2433">Air (rarer)</text>
  <text x="20" y="180" fill="#1d2433">Glass (denser)</text>
  <text x="228" y="110" fill="#1d2433">i</text>
  <text x="272" y="200" fill="#1d2433">r</text>
  <text x="268" y="34" fill="#5b6b8c">Normal</text>
</svg>
<p>Going from a rarer to a denser medium, the ray bends <b>towards</b> the normal (r &lt; i). Going from denser to rarer, it bends <b>away</b> from the normal.</p>

<h2 id="laws">Laws of refraction</h2>
<ol>
<li>The incident ray, the refracted ray and the normal at the point of incidence all lie in the same plane.</li>
<li>For a given pair of media and a given colour of light, the ratio of sin i to sin r is constant. This is Snell's law.</li>
</ol>

<h2 id="index">Refractive index</h2>
<div class="box"><div class="formula">n = c / v</div>where c is the speed of light in vacuum and v is the speed of light in the medium.</div>
<table><thead><tr><th>Medium</th><th>Refractive index (n)</th></tr></thead><tbody>
<tr><td>Air</td><td class="n">1.0003</td></tr>
<tr><td>Water</td><td class="n">1.33</td></tr>
<tr><td>Crown glass</td><td class="n">1.52</td></tr>
<tr><td>Diamond</td><td class="n">2.42</td></tr>
</tbody></table>

<h2 id="snell">Snell's law</h2>
<div class="box"><div class="formula">n₁ sin i = n₂ sin r</div></div>

<h2 id="example">Worked example</h2>
<p>Light enters water (n = 1.33) from air at an angle of incidence of 45°. Find the angle of refraction.</p>
<p>sin r = (1.00 × sin 45°) ÷ 1.33 = 0.707 ÷ 1.33 = 0.532, so r ≈ 32°.</p>

<h2 id="check">Quick check</h2>
<div class="q">1. The speed of light in glass is 2 × 10<sup>8</sup> m/s. What is the refractive index of glass?</div>
<div class="q">2. Why does a pencil look bent when it is partly dipped in water?</div>
<div class="q">3. A ray goes from glass into air. Does it bend towards or away from the normal?</div>
</div></body></html></script>

const Sync=(()=>{

      central.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz}
    const csz=central.reduce((a,x)=>a+x.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csz,true);end.setUint32(16,off,true);
    return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/zip'})}
  async function downloadConfigured(){
    try{const base=location.href.split('#')[0].replace(/[^/]*$/,'');const src=await(await fetch(location.href.split('#')[0],{cache:'no-store'})).text();
      const line=`const GOOGLE={clientId:${JSON.stringify(st.cfg.clientId)},apiKey:${JSON.stringify(st.cfg.apiKey)},projectNumber:${JSON.stringify(st.cfg.projectNumber)}};`;
      const out=src.replace(/const GOOGLE=\{clientId:[^\n]*?\};/,line);if(out===src&&!src.includes(line))throw 0;
      const extra=['manifest.webmanifest','sw.js','icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon.png'],files=[{name:'index.html',data:new TextEncoder().encode(out)}];
      for(const n of extra){try{const r=await fetch(base+n,{cache:'no-store'});if(r.ok)files.push({name:n,data:new Uint8Array(await r.arrayBuffer())})}catch(e){}}
      if(files.length>1){await saveFile('inkleaf-site.zip',makeZip(files));toast('Drop inkleaf-site.zip on your Netlify site to update it.')}
      else{await saveFile('index.html',out);toast('Upload this index.html to Netlify to replace the old file.')}}
    catch(e){toast('Could not copy the page from this site. Paste the values into the GOOGLE line near the top of the file instead.')}
  }

  const picker=()=>st.pkP||(st.pkP=loadScript('https://apis.google.com/js/api.js').then(()=>new Promise((res,rej)=>gapi.load('picker',{callback:res,onerror:rej}))).catch(e=>{st.pkP=null;throw e}));
  async function openFromDrive(){
    if(CLOUD.on&&CLOUD.picker){st.cfg.apiKey=CLOUD.picker.key;st.cfg.projectNumber=CLOUD.picker.appId}
    if(!configured()){setup();return}
    if(!st.cfg.apiKey||!st.cfg.projectNumber){toast('Add the API key and project number in Google Drive setup to browse your Drive.');setup();return}
    try{
      if(CLOUD.on)await token(true);
      else if(!st.on||!hasToken()){await token(true);st.on=true;ls.set('inkleaf.gd',true);loadUser().catch(()=>{});syncAll()}
      await picker();
      const view=new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('text/html,application/xhtml+xml,application/pdf').setIncludeFolders(true).setSelectFolderEnabled(false).setMode(google.picker.DocsViewMode.LIST);
      const pk=new google.picker.PickerBuilder().addView(view).enableFeature(google.picker.Feature.MULTISELECT_ENABLED).setOAuthToken(st.token).setDeveloperKey(st.cfg.apiKey).setAppId(st.cfg.projectNumber).setOrigin(location.origin).setTitle('Choose HTML notes or PDFs')
        .setCallback(async d=>{if(d[google.picker.Response.ACTION]!==google.picker.Action.PICKED)return;const docs=d[google.picker.Response.DOCUMENTS]||[];const ids=[];toast('Opening '+docs.length+' note'+(docs.length===1?'':'s')+' from Drive…');
          for(const doc of docs){try{const id=doc[google.picker.Document.ID],name=doc[google.picker.Document.NAME]||'Note';
            const isPdf=doc[google.picker.Document.MIME_TYPE]==='application/pdf'||/\.pdf$/i.test(name);
            if(isPdf){const ex=[...mem.values()].find(x=>x.drivePdf===id);if(ex){ids.push(ex.id);continue}
              const r=await pdfToNote(await(await api(`${DAPI}/${id}?alt=media`)).arrayBuffer(),name);if(r){const b=newBook({title:r.title,html:r.html,src:'pdf',pdfPages:r.pages,drivePdf:id});await dbPut(b);ids.push(b.id)}continue}
            const txt=await(await api(`${DAPI}/${id}?alt=media`)).text();
            const ex=[...mem.values()].find(x=>x.driveSrc===id);if(ex){ids.push(ex.id);continue}
            const b=newBook({title:titleFrom(txt,name.replace(/\.[^.]+$/,'')),html:txt,driveSrc:id});await dbPut(b);ids.push(b.id)}catch(e){toast(e.message)}}
          if(ids.length&&ids.length<=MAXP)openWorkspace(ids);else renderShelf()}).build();
      pk.setVisible(true);
    }catch(e){toast(e.message||'Could not open Google Drive.')}
  }
  async function reloadNote(P){
    const b=P.book;if(!b.driveSrc)return;
    try{await token(true);const txt=await(await api(`${DAPI}/${b.driveSrc}?alt=media`)).text();if(txt===b.html){toast('This note is already up to date.');return}
      b.html=txt;b.updated=Date.now();await dbPut(b);P.applyRemote('Reloaded the latest version from Google Drive')}catch(e){toast(e.login?'Sign in to Google again, then retry.':e.message)}
  }
  async function saveExport(P){
    const b=P.book;try{await token(true);toast('Saving to Google Drive…');const fid=await folder(),name=safeName(b.title)+' (annotated).html';let id=b.driveExport||null;
      if(id){try{const j=await(await api(`${DAPI}/${id}?fields=id,trashed`)).json();if(j.trashed)id=null}catch(e){if(e.login)throw e;id=null}}
      const r=await upload(id?{name}:{name,parents:[fid],mimeType:'text/html'},P.exportHTML(),id,'text/html');b.driveExport=r.id;await dbPut(b,{local:true});toast('Saved “'+name+'” to the Mountain Notes folder in Google Drive.')}
    catch(e){toast(e.login?'Sign in to Google again, then retry.':e.message)}
  }
  function init(){
    if(CLOUD.on){ui();$('#gdOpenBtn').onclick=openFromDrive;return}
    ui();if(!web())return;
    $('#gdBtn').onclick=()=>{if(!configured())setup();else if(!st.on)connect();else if(st.state==='login'||!hasToken())connect();else accountDialog()};
    $('#gdOpenBtn').onclick=openFromDrive;
    if(configured()&&st.on){st.user=ls.get('inkleaf.gdUser',null);if(hasToken()||NATIVE){syncAll()}else set('login')}
    setInterval(()=>{if(document.visibilityState==='visible'&&st.on&&(hasToken()||NATIVE))syncAll()},60000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&st.on&&(hasToken()||NATIVE))syncAll()});
  }
  return{init,queue,tombstone,available:()=>CLOUD.on||(configured()&&st.on),saveExport,reloadNote,syncAll,st};
})();

const HELP=[
 {id:'start',t:'Getting started',h:`
<p>Mountain Notes keeps your lessons as notebooks on this device. Each notebook can be a document you import, a blank notebook for working problems, or a whiteboard.</p>
<h4>Adding notebooks</h4>
<ul>
<li><b>Import</b> opens HTML notes (.html) and PDF files (.pdf). You can pick several files at once. A backup file (.json) made with <b>Backup</b> restores all the notebooks inside it.</li>
<li><b>+ New → Paste HTML</b> creates a notebook from HTML you copied from anywhere.</li>
<li><b>+ New → Blank notebook</b> gives you lined, grid, dotted or plain paper to write on.</li>
<li><b>+ New → Whiteboard</b> is a wide dotted board for diagrams and rough work.</li>
<li><b>Open from Drive</b> appears once Google Drive is set up and lets you pick HTML or PDF files from your Drive.</li>
</ul>
<h4>Imported PDFs</h4>
<p>Each PDF page becomes a sharp page in the notebook. The PDF's text is kept invisibly underneath, so search and Find still work. Up to 300 pages can be imported at a time. The first import needs an internet connection to load the PDF reader.</p>
<h4>The home screen</h4>
<ul>
<li>The sidebar on the left has <b>Documents</b>, <b>Recents</b> (what you opened lately), <b>Favorites</b>, <b>Not synced</b> (when signed in with Google) and your <b>Folders</b>. On a narrow screen these appear as buttons under the search box, and the <b>⋯</b> button at the top holds Backup and the other extras.</li>
<li><b>Documents</b> shows your folders first, then notebooks that are not in a folder. Tap a folder to open it; <b>‹ Documents</b> takes you back.</li>
<li>Each notebook shows a picture of its first page, made when you leave it. Under it: when it was changed, what it is and its size.</li>
<li>The <b>···</b> button under a notebook: Open, Rename, Move to folder, Add to Favorites, Remove download / Keep on this device (when signed in), and Delete. The <b>···</b> under a folder renames or deletes it (its notebooks are kept).</li>
<li><b>Search all documents</b> finds notebooks by title, note text, typed text boxes and tables. <b>Date modified</b> changes the order: date modified, name or date created.</li>
<li>The list button switches between pictures and a compact list.</li>
<li><b>Select</b> lets you tick several notebooks, then <b>Open side by side</b> (two or three), <b>Move</b>, <b>Favorite</b> or <b>Delete</b> them together.</li>
<li><b>+ New</b> makes a blank notebook, a whiteboard, a notebook from pasted HTML, or a folder. <b>Import</b> opens HTML, PDF and backup files.</li>
<li><b>Backup</b> saves every notebook, with all its ink, into one .json file. Import it on any device to restore.</li>
</ul>`},
 {id:'pen',t:'Writing with S Pen and Apple Pencil',h:`
<h4>Pen and fingers</h4>
<ul>
<li>The pen writes. Fingers scroll and zoom, so you can rest your hand on the screen while you write — your palm is ignored while the pen is near the glass.</li>
<li><b>One finger</b> scrolls. <b>Two fingers</b> pinch to zoom. A quick <b>two-finger tap</b> undoes, a <b>three-finger tap</b> redoes.</li>
<li>Turn on <b>Draw with finger</b> in the ⋯ menu if you want to write with your finger instead (for example without a stylus).</li>
</ul>
<h4>S Pen side button</h4>
<ul>
<li>Hold the side button and touch the screen to erase. You can also press it in the middle of a stroke.</li>
<li>In the ⋯ menu, <b>S Pen side button</b> sets what the button does: <b>Eraser</b>, <b>Lasso</b> or <b>Nothing</b>.</li>
<li><b>Test pen</b> shows whether the button is reaching Mountain Notes.</li>
<li>On Samsung tablets, use <b>Samsung Internet</b> or the Mountain Notes Android app. Chrome on Android does not pass the side button to web pages.</li>
</ul>
<h4>Apple Pencil</h4>
<p>The Pencil writes with pressure. Fingers scroll and zoom. Use the eraser button in the top bar, or two-finger tap to undo.</p>
<h4>Snapping shapes</h4>
<p>Draw a line, circle, triangle or box and keep the pen still for about a second at the end. The stroke snaps into a neat shape; lift the pen to keep it. Small marks such as letters never snap, so pauses while writing are safe. Turn it off with <b>⋯ → Snap to shapes</b>.</p>
<h4>Keyboard</h4>
<p>With a keyboard: Ctrl/⌘ + Z undoes, Ctrl/⌘ + Y redoes, Ctrl/⌘ + F opens Find, and Delete removes what the lasso has selected.</p>`},
 {id:'topbar',t:'The top bar',h:`
<ul>
<li><b>‹</b> goes back to your notebooks. The title next to it can be tapped and renamed.</li>
<li><b>Eraser</b> switches to the eraser. Tap it again to go back to the tool you were using.</li>
<li><b>Undo</b> and <b>Redo</b>.</li>
<li><b>Size</b> (the dot and number) opens a slider for the pen, highlighter and eraser, with a preview and Fine / Medium / Bold presets.</li>
<li><b>Colours</b> change the colour of the current pen. The rainbow circle picks any colour. On a chalkboard the palette switches to chalk colours.</li>
<li><b>Split screen</b> opens another notebook beside this one.</li>
<li><b>Insert</b> adds a text box, equation, shape, graph, graph paper, table, element or a writing page.</li>
<li><b>Outline</b> shows the note's headings, your bookmarks and Find.</li>
<li><b>− 100% +</b> zooms. Tap the percentage to fit the page to the width again.</li>
<li><b>⋯</b> opens the menu with settings, export and more.</li>
</ul>`},
 {id:'look',t:'Appearance: themes and icon packs',h:`
<ul>
<li>Tap the palette button at the top of the home screen (or <b>⋯ → Appearance</b> inside a notebook).</li>
<li><b>Colour theme</b>: Mountain, Classic blue, Paper, Forest, Ocean, Lavender, Rose or Graphite. The theme colours the home screen, the bars, buttons and menus. Your notes and ink keep their own colours.</li>
<li><b>Light or dark</b>: Automatic follows your tablet's setting; Light and Dark stay fixed.</li>
<li><b>Icon pack</b>: Line, Thin, Bold, Duotone (shapes filled with a soft tint), Tiles (each icon on a small rounded tile) or Sketch (a hand-drawn look).</li>
<li>Folder colours: <b>···</b> on a folder → <b>Colour…</b>. The colour shows on the folder, in the sidebar and in the buttons on a narrow screen, and syncs to your other devices.</li>
<li>Appearance is kept per device, so the iPad and the Samsung tablet can look different.</li>
</ul>`},
 {id:'tools',t:'Tools',h:`
<ul>
<li><b>Hand</b> scrolls with the pen and lets you tap links inside the note.</li>
<li><b>Pen</b> writes with pressure. Choose the size with the three dots or the slider beside them.</li>
<li><b>Highlighter</b> draws wide see-through strokes for marking text.</li>
<li><b>Eraser</b> has two modes: <b>Whole stroke</b> removes a stroke you touch; <b>Partial</b> rubs out only the part you pass over. Choose whether it also erases text boxes, equations, pictures, graphs and tables.</li>
<li><b>Lasso</b> selects things (see <i>Lasso and selection</i>).</li>
<li><b>Shapes</b> draws lines, arrows, rectangles, circles, triangles, polygons, stars and more (see <i>Shapes</i>).</li>
<li><b>Text box</b>: tap where the text should go and type. Tap a text box with this tool to edit it.</li>
<li><b>Equation</b>: tap the page and type LaTeX, for example <code>\\frac{a}{b}</code> or <code>n_1 \\sin i = n_2 \\sin r</code>.</li>
<li><b>Graph</b> and <b>Table</b>: tap where it should go (see <i>Graphs</i> and <i>Tables</i>).</li>
</ul>
<h4>Favourites</h4>
<p>The star next to the sizes saves the current pen, colour and size as a favourite. Favourites appear in the tool bar for one-tap switching. You can keep up to eight.</p>`},
 {id:'teach',t:'Teaching tools',h:`
<ul>
<li><b>Vanishing ink</b> writes in a colour that fades a few seconds after you lift the pen — useful for pointing and circling while you talk.</li>
<li><b>Spotlight</b> darkens the screen except for a circle around the pen. Change its size with the size control. Switch tools to remove it.</li>
<li><b>Zoom to area</b>: drag a box around the part you want to enlarge. Tap the zoom percentage to fit again.</li>
<li><b>Reveal cover</b> hides the note below a line. <b>Cover from here</b> places it; each tap on the note uncovers the next part. <b>Remove cover</b> shows everything.</li>
<li><b>Tape</b>: drag across words to hide them under a strip of tape. Tap the tape to reveal it, tap again to hide. <b>Reveal all</b> and <b>Hide all</b> work on every tape at once.</li>
<li><b>Timer</b> shows a countdown you can drag anywhere on the screen. Start, pause and reset it with its buttons.</li>
<li><b>Present mode</b> (⋯ menu) hides everything except the note and a small tool bar, for recording or projecting.</li>
<li><b>Channel watermark</b> (⋯ menu) shows your channel name or logo on every note so it appears in your recordings. Choose the corner and how strong it looks. It is not added to exported files.</li>
</ul>`},
 {id:'inst',t:'Ruler and protractor',h:`
<ul>
<li>Tap <b>Ruler</b> or <b>Protractor</b> in the tool bar to show it. Tap again to hide it.</li>
<li>Move it, turn it and pinch it to resize with two fingers.</li>
<li>Draw along the ruler's edge with the pen for a perfectly straight line.</li>
<li>Read angles from the protractor's scale while you draw.</li>
</ul>`},
 {id:'shapes',t:'Shapes',h:`
<ul>
<li>Choose <b>Shapes</b>, then tap it again (or the shape button next to the sizes) to open the shape picker.</li>
<li>Pick a line, arrow, double arrow, rectangle, rounded rectangle, ellipse, triangle, right triangle, diamond, parallelogram, pentagon, hexagon, star or cylinder.</li>
<li><b>Fill</b>: None, Light or Solid, in the current colour.</li>
<li><b>Dashed line</b> draws the outline dashed.</li>
<li><b>Equal sides</b> makes squares and circles, and keeps lines at 15° steps.</li>
<li>Drag on the page to draw the shape.</li>
</ul>`},
 {id:'graphs',t:'Graphs',h:`
<h4>Plotting</h4>
<ul>
<li>Choose <b>Graph</b> and tap the page, or use Insert → Graph.</li>
<li>Each row can be <b>y =</b> (for example <code>2x + 1</code>, <code>sin(x)</code>) or <b>x =</b> (for example <code>y^2 - 3</code>).</li>
<li>Expressions can use + − * / ^, brackets, pi, and sin, cos, tan, sqrt, abs, ln, log and exp. <code>2x</code> and <code>3sin(x)</code> work too.</li>
<li><b>Points</b>: type <code>(0,1) (2,5) (4,3)</code>. Tick <b>Join the points</b> for a line through them, and <b>Show coordinates</b> to label each one.</li>
</ul>
<h4>Empty graph and graph paper</h4>
<ul>
<li><b>Empty graph (for writing)</b> draws only the axes and grid, so you can plot by hand while teaching.</li>
<li><b>Insert → Graph paper</b> gives a square −10 to 10 grid in one tap.</li>
</ul>
<h4>Axes and look</h4>
<ul>
<li>Set the x and y ranges, the gap between units on each axis and the axis names.</li>
<li><b>Fit y to the curves</b> chooses the y range for you.</li>
<li><b>Grid lines</b>, <b>Small squares</b> and <b>Numbers on axes</b> turn those parts on or off.</li>
<li><b>Same scale on both axes</b> makes one unit the same length across and up, so circles look round.</li>
<li><b>Quick ranges</b>: all four quadrants, first quadrant only, or x from 0.</li>
<li>To change a graph later, select it with the lasso and tap <b>Edit</b>. Drag a corner to resize it.</li>
</ul>`},
 {id:'tables',t:'Tables',h:`
<h4>Making a table</h4>
<ul>
<li>Choose <b>Table</b> and tap the page. Pick a layout: Blank, Journal entries, Ledger account (T-form), Trial balance, Balance sheet or Calculation sheet.</li>
<li>Tap a table on the page with the Table tool to edit it again.</li>
</ul>
<h4>Formulas</h4>
<ul>
<li>Start a cell with <b>=</b>. Use + − * / ^ %, brackets, cell names like <code>D7</code> and ranges like <code>D2:D8</code>.</li>
<li>Functions: SUM, AVERAGE, MIN, MAX, COUNT, ROUND, ABS and IF. For example <code>=SUM(D2:D8)</code>, <code>=D7-E7</code>, <code>=B2*C2</code>.</li>
<li>While typing a formula, tap another cell to add its name.</li>
<li>Enter moves down, Tab moves right. Rows and columns added or removed keep formulas pointing at the right cells.</li>
</ul>
<h4>Selecting</h4>
<ul>
<li>Tap a column letter to select the whole column, or a row number for the whole row. Drag across letters or numbers to select several. Tap the corner ◢ to select the whole table.</li>
<li>With a mouse or pen you can also drag across cells to select a block.</li>
</ul>
<h4>Formatting</h4>
<ul>
<li><b>B</b> bold, <b>Left / Centre / Right</b> alignment and <b>Top / Middle / Bottom</b> position apply to every selected cell.</li>
<li><b>Header row</b> shades and bolds the selected rows. <b>Total line</b> adds a single line above and a double line below, as in accounts.</li>
<li><b>Numbers</b>: General, 0 or 2 decimal places; 1000, 1,000 or 1,00,000 grouping; negatives as −5 or (5).</li>
</ul>
<h4>Sizing</h4>
<ul>
<li>Drag the bar on the right of a column letter to change its width, or the bar under a row number to change its height. Double-tap a bar to return it to automatic size.</li>
<li><b>Narrower</b>, <b>Wider</b>, <b>Shorter</b>, <b>Taller</b> and <b>Auto size</b> do the same for the selection.</li>
<li>To make the whole table bigger or smaller, select it with the lasso and drag a corner.</li>
</ul>`},
 {id:'lasso',t:'Lasso and selection',h:`
<ul>
<li>With the <b>Lasso</b>, draw a loop around ink, text, shapes, pictures, graphs or tables — or tap a single item.</li>
<li>Drag inside the box to move the selection. Drag any of the four round corners to resize it.</li>
<li>The bar above the selection lets you change its <b>colour</b>, <b>Duplicate</b> it, <b>Edit</b> a graph, table or equation, <b>Save as element</b>, or <b>Delete</b> it.</li>
<li>In split screen, drag a selection onto another pane to copy it there.</li>
<li>Tap <b>Done</b> or tap empty space to finish.</li>
</ul>`},
 {id:'elements',t:'Elements library',h:`
<ul>
<li>Select anything with the lasso and tap <b>Save as element</b> to keep it in your library — a diagram you draw often, a stamp, a labelled figure.</li>
<li>Open the library from the <b>Elements</b> button in the tool bar or Insert → Element, and tap an element to add it to the current page.</li>
<li>Elements are shared by all your notebooks.</li>
</ul>`},
 {id:'split',t:'Split screen',h:`
<ul>
<li>Tap <b>Split screen</b> in the top bar to open another notebook beside the current one. Up to three notebooks fit on screen.</li>
<li>Drag the divider between panes to change their sizes. <b>Make panes equal</b> (⋯ menu) evens them out.</li>
<li><b>Side by side / stacked</b> switches between columns and rows.</li>
<li><b>Swap</b> exchanges the positions of the notes.</li>
<li><b>Scroll panes together</b> links their scrolling.</li>
<li>The pane you last touched is the active one — the tools and menu act on it. Close a pane with its ×.</li>
<li>Mountain Notes remembers what you had open; <b>Resume split view</b> in the sidebar opens it again.</li>
</ul>`},
 {id:'paper',t:'Pages and paper',h:`
<ul>
<li><b>Add writing page</b> (⋯ menu or Insert) adds space below the note to work problems.</li>
<li><b>Writing paper</b> sets the pattern of writing pages: Blank, Ruled, Grid or Dots.</li>
<li><b>Note width</b>: Narrow, Normal or Wide. The note reflows and your ink stays on the paragraph it was written on.</li>
<li><b>Chalkboard</b> turns the page into a dark board with chalk colours. HTML notes are shown inverted.</li>
<li><b>Insert image</b> adds a picture from your device. Resize it with the lasso.</li>
<li><b>Clear all ink</b> removes all writing from this note (you can undo it).</li>
</ul>`},
 {id:'outline',t:'Outline, bookmarks and Find',h:`
<ul>
<li><b>Outline</b> lists the headings of the note. Tap one to jump to it.</li>
<li><b>Bookmarks</b> mark places you want to come back to during a lesson.</li>
<li><b>Find</b> searches the text of the note and highlights each match.</li>
</ul>`},
 {id:'export',t:'Export and sharing',h:`
<h4>Export as PDF</h4>
<ul>
<li><b>Paper size</b>: A4, Letter, A5, Legal or A3, in Portrait or Landscape.</li>
<li><b>Margins</b>: None, Narrow (10 mm), Normal (20 mm), Wide (30 mm) or Custom top, bottom, left and right.</li>
<li><b>Content size</b> shrinks the note within the margins. <b>Quality</b> chooses between a smaller file and a sharper one.</li>
<li><b>Page numbers</b> and <b>Title and date at the top</b>.</li>
<li><b>Don't cut through lines of text</b> moves page breaks so lines, handwriting, tables and graphs are not split, and headings stay with the text after them.</li>
<li><b>Include writing pages</b> and <b>Skip empty writing pages</b>.</li>
<li><b>Keep tape covering answers</b> exports tape closed (for student copies) or leaves the answers showing.</li>
<li>For imported PDFs, <b>Keep the original PDF pages</b> gives back the same pages at their original size with your writing on top.</li>
<li>The preview shows the margins and how many pages you will get. When the PDF is ready, choose <b>Save PDF</b>, <b>Share…</b> (to Files, Drive or another app) or <b>Open</b>.</li>
</ul>
<h4>Export with ink (.html)</h4>
<p>Saves the note with your ink drawn on it as an HTML file that opens in any browser.</p>
<h4>Google Drive</h4>
<p><b>Save annotated copy to Google Drive</b> puts the HTML export in the Mountain Notes folder of your Drive. <b>Reload note from Google Drive</b> brings in your latest edits to a note you opened from Drive; your ink stays on its paragraphs.</p>`},
 {id:'cloud',t:'Google Drive backup and sync',cloud:true,h:`
<ul>
<li>You sign in with Google when Mountain Notes opens. Your notebooks, their ink and your folders are kept in a hidden Mountain Notes folder in your own Google Drive.</li>
<li><b>Sync</b> (at the top of the home screen, and in the ⋯ menu inside a notebook) sends your changes to Drive and brings in changes from your other devices. The orange number shows how many notebooks have changes waiting; those notebooks have an orange dot.</li>
<li>Until you sync, changes stay safely on this device. Turn on <b>Sync automatically</b> in your account (your picture at the top, or your name in the sidebar) to sync on its own every little while.</li>
<li>If the same notebook was changed on two devices, a rename or folder move from one and new ink from the other are combined. If the ink was changed on both, the newer is kept and the other is saved as a copy with “(other device …)” in its name.</li>
<li>After a sync that sent something to Drive, Mountain Notes asks whether to remove the synced notebooks' copies from this device to free space. Tick <b>Don’t ask again</b> to stop the question; <b>Free up space now</b> in your account does it any time.</li>
<li>Only the note itself (the HTML or PDF pages) is removed. Names, folders and your ink stay. A removed notebook shows a cloud mark and downloads again when you open it, which needs internet.</li>
<li>Never removed: notebooks with changes not yet in Drive, the notebook that is open, and notebooks set to <b>Keep on this device</b>.</li>
<li>The <b>···</b> button under a notebook gives <b>Remove download</b> (or <b>Download to this device</b>) and <b>Keep on this device</b>. <b>Not synced</b> in the sidebar lists notebooks with changes waiting.</li>
<li>On your other devices the whole list appears after a sync; each note downloads the first time you open it there.</li>
<li>Before you sign out or switch account, Mountain Notes offers to sync anything not yet in Drive.</li>
<li>Deleting a notebook removes it from Drive and from your other devices when they sync.</li>
</ul>`},
 {id:'conn',t:'Connections: your Google Drive',cloud:true,h:`
<ul>
<li>Under <b>Connections</b> in the sidebar you see your Google account. Tap it to browse <b>My Drive</b> and <b>Shared with me</b>, with folders and <b>Search this Google Drive</b>. Mountain Notes shows HTML notes, PDFs and folders.</li>
<li>Tap a file to open it. A copy is kept on this device (a check mark shows which ones), so it opens offline next time and appears in Documents.</li>
<li>Your original file in Drive is never changed. When you tap <b>Sync</b>, your writing is saved next to it as <b>“name (annotated).pdf”</b> (or .html for HTML notes), and later Syncs keep that copy up to date. An orange mark shows writing not yet saved to Drive.</li>
<li><b>···</b> on a notebook: <b>Save to Google Drive…</b> puts any notebook in a Drive folder you choose; <b>Save to Drive now</b> saves immediately; <b>Get the latest from Drive</b> brings in a newer version of the original. For an HTML note your writing stays on its paragraphs; for a PDF you get a fresh copy and the old one, with its writing, is kept as “(older copy)”.</li>
<li><b>Add Google Drive</b> connects another Google account, for example a school account. The <b>···</b> next to an account's name disconnects it.</li>
<li>The first time, Google shows “Google hasn’t verified this app”. Tap <b>Advanced → Go to Mountain Notes</b>: this is your own copy of Mountain Notes asking to see your Drive.</li>
</ul>`},
 {id:'drive',t:'Google Drive sync',web:true,h:`
<ul>
<li>Sign in with Google from <b>Set up Google Drive</b> in the sidebar. Every notebook, with its ink, is kept in an <b>Mountain Notes</b> folder in your Drive.</li>
<li>Sign in with the same Google account on your other devices and the notebooks appear there. Changes sync within a few seconds and whenever you come back to the app.</li>
<li>Large notebooks such as imported PDFs upload their pages once; after that only your writing is sent.</li>
<li>Deleting a notebook on one device deletes it on the others.</li>
<li>Mountain Notes can only see the files it created or that you open with it. Tap <b>Google Drive</b> in the sidebar to sign out.</li>
<li><b>Set up Google Drive</b> needs your Client ID, API key and project number once. <b>Download site with these settings</b> gives you a copy of the site with them built in, to upload to Netlify.</li>
</ul>`},
 {id:'claude',t:'Claude link version',art:true,h:`
<ul>
<li><b>Sync</b> stores your notebooks privately in your Claude account so they open on your other devices.</li>
<li><b>Ask Claude</b>: drag a box around part of a note and ask a question about it.</li>
<li><b>Convert handwriting to text</b>: select ink with the lasso and Claude turns it into typed text.</li>
<li><b>Make handwriting searchable</b> lets search and Find match your handwriting.</li>
<li><b>Live view</b>: students who open the page watch your ink as you write. <b>Follow</b> keeps their view scrolled with yours.</li>
</ul>`},
 {id:'versions',t:'Version history',h:`
<ul>
<li>A version of your ink is saved each time you open a note. <b>Save current version</b> keeps one now.</li>
<li><b>Restore</b> brings back an older version. The current ink is kept first, so you can undo the restore.</li>
</ul>`},
 {id:'toolbar',t:'Customising the tool bar',h:`
<ul>
<li><b>Tool bar position</b> (⋯ menu): Top, Bottom, Left, Right or Floating. You can also drag the ⠿ handle to any edge, or into the page to float it.</li>
<li><b>Arrange tool bar</b> lets you turn tools on or off and change their order. Pressing and holding any tool does the same.</li>
</ul>`},
 {id:'install',t:'Installing on your tablet',h:`
<ul>
<li><b>iPad (Safari)</b>: open your Mountain Notes site, tap Share → <b>Add to Home Screen</b>. It opens full screen and works offline.</li>
<li><b>Samsung (Samsung Internet)</b>: open your site, tap the menu → <b>Add page to</b> → <b>Home screen</b>.</li>
<li><b>Android app</b>: the Mountain Notes APK installs like any app and supports the S Pen side button directly.</li>
<li>Notebooks are stored on each device. Use Google Drive sync or Backup to move them between devices.</li>
</ul>`},
 {id:'trouble',t:'Troubleshooting',h:`
<ul>
<li><b>The S Pen button doesn't erase</b>: use Samsung Internet or the Android app, and check <b>S Pen side button</b> is set to Eraser. Use <b>Test pen</b> to see what the pen sends.</li>
<li><b>Fingers draw instead of scrolling</b>: turn off <b>Draw with finger</b>.</li>
<li><b>The page zoomed and everything looks wrong</b>: tap the zoom percentage to fit the page again.</li>
<li><b>PDF import or export says it can't load</b>: connect to the internet once; the reader and renderer are saved for later.</li>
<li><b>Drive shows a sync problem</b>: tap the Drive button and sign in again.</li>
<li><b>Storage is full</b>: delete notebooks you no longer need, especially large PDFs, or make a Backup and remove old ones.</li>
</ul>`}
];

const Help=(()=>{
  const el=$('#help'),nav=$('#helpNav'),main=$('#helpMain'),q=$('#helpQ');let built=false,lastFocus=null;
  const secs=()=>HELP.filter(x=>(!x.art||IN_ARTIFACT)&&(!x.web||(!IN_ARTIFACT&&!CLOUD.on))&&(!x.cloud||CLOUD.on));
  function build(){if(built)return;built=true;
    main.innerHTML=secs().map(x=>`<section class="hp-sec" id="hp-${x.id}" data-id="${x.id}"><h3>${x.t}</h3>${x.h}</section>`).join('')+'<p class="hp-none" id="hpNone" hidden>Nothing matches.</p>';
    nav.innerHTML=secs().map(x=>`<button type="button" data-go="${x.id}">${x.t}</button>`).join('');
    nav.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const t=$('#hp-'+b.dataset.go);if(t)main.scrollTo({top:t.offsetTop-main.offsetTop-4,behavior:'smooth'});cur(b.dataset.go)});
    main.querySelectorAll('.hp-sec').forEach(sec=>sec.querySelectorAll('p,li').forEach(n=>n.dataset.raw=n.innerHTML));
    main.addEventListener('scroll',()=>{if(q.value)return;const top=main.scrollTop+main.offsetTop+40;let id=null;main.querySelectorAll('.hp-sec').forEach(sec=>{if(sec.offsetTop<=top)id=sec.dataset.id});if(id)cur(id)},{passive:true})}
  function cur(id){nav.querySelectorAll('[data-go]').forEach(b=>{const on=b.dataset.go===id;b.setAttribute('aria-current',on);if(on&&getComputedStyle(nav).flexDirection==='row')b.scrollIntoView({block:'nearest',inline:'nearest'})})}
  function filter(){const t=q.value.trim().toLowerCase();let any=false;
    main.querySelectorAll('.hp-sec').forEach(sec=>{let hit=!t||sec.querySelector('h3').textContent.toLowerCase().includes(t);
      sec.querySelectorAll('p,li').forEach(n=>{n.innerHTML=n.dataset.raw;if(!t)return;if(n.textContent.toLowerCase().includes(t)){hit=true;markIn(n,t)}});
      sec.hidden=!hit;nav.querySelector(`[data-go="${sec.dataset.id}"]`).hidden=!hit;if(hit)any=true});
    $('#hpNone').hidden=any;main.scrollTop=0}
  function markIn(n,t){const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);const hits=[];let x;while((x=w.nextNode())){const i=x.nodeValue.toLowerCase().indexOf(t);if(i>=0)hits.push([x,i])}
    for(const[node,i]of hits){const r=document.createRange();r.setStart(node,i);r.setEnd(node,i+t.length);const m=document.createElement('mark');try{r.surroundContents(m)}catch(e){}}}
  function open(topic){build();lastFocus=document.activeElement;el.hidden=false;$('#menu').hidden=true;
    if(topic){const t=$('#hp-'+topic);if(t)requestAnimationFrame(()=>{main.scrollTop=t.offsetTop-main.offsetTop-4;cur(topic)})}else{main.scrollTop=0;cur(secs()[0].id)}
    setTimeout(()=>$('#helpClose').focus(),30)}
  function close(){el.hidden=true;if(q.value){q.value='';filter()}try{lastFocus&&lastFocus.focus()}catch(e){}}
  $('#helpClose').onclick=close;q.addEventListener('input',filter);
  el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();close()}});
  return{open,close};
})();
$('#helpBtn').onclick=()=>Help.open();
$('#helpMenuBtn').onclick=()=>Help.open();


/* ================= Google sign-in and Drive backup (Vercel) =================
   When Mountain Notes is served from Vercel with the /api function, you sign in with Google first. Every notebook,
   its ink and your folders are then kept in a hidden Mountain Notes app folder in your own Google Drive, and every
   device signed in to the same account gets them when it syncs. Changes stay on this device until you tap
   Sync, unless "Sync automatically" is on. Opened anywhere else (as a file, in the Android app, in Claude)
   Mountain Notes works exactly as before. */
const CLOUD={
  mode:'local',user:null,tok:null,exp:0,lost:false,pending:null,picker:null,scope:'',accounts:[],toks:new Map(),
  get on(){return this.mode==='cloud'},
  avail:()=>/^https?:$/.test(location.protocol)&&!IN_ARTIFACT&&!ANDROID,
  async fetchToken(acct){
    let r;try{r=await fetch('/api/token'+(acct?'?acct='+encodeURIComponent(acct):''),{cache:'no-store',credentials:'same-origin'})}catch(e){return{net:true}}
    const ct=r.headers.get('content-type')||'';if(!ct.includes('json'))return{none:true};
    let j={};try{j=await r.json()}catch(e){return{none:true}}
    if(j.accounts)this.accounts=j.accounts;
    if(r.ok&&j.access_token){if(!acct){this.scope=j.scope||'';if(j.picker)this.picker=j.picker}return{ok:true,...j}}
    if(r.status===409)return{reconnect:true,...j};
    if(r.status===401)return{signin:true,...j};
    if(r.status===404&&!j.error)return{none:true};
    return{error:true,...j};
  },
  async token(){
    if(this.tok&&Date.now()<this.exp-90e3)return this.tok;
    if(!this.pending)this.pending=(async()=>{
      const j=await this.fetchToken();
      if(j.ok){this.tok=j.access_token;this.exp=Date.now()+(j.expires_in||3600)*1000;this.setUser(j.user);this.lost=false;return this.tok}
      if(j.signin){this.tok=null;this.signedOut(j.reason);throw Object.assign(new Error('signin'),{signin:true,login:1})}
      throw Object.assign(new Error('offline'),{offline:true});
    })().finally(()=>{this.pending=null});
    return this.pending;
  },
  setUser(u){if(!u)return;this.user=u;ls.set('inkleaf.acct',u)},
  /* a token for one of the connected Google accounts (the signed-in account uses token()) */
  async tokenFor(acct){
    if(!acct||(this.user&&acct===this.user.email))return this.token();
    const c=this.toks.get(acct);if(c&&Date.now()<c.exp-90e3)return c.tok;
    const j=await this.fetchToken(acct);
    if(j.ok){this.toks.set(acct,{tok:j.access_token,exp:Date.now()+(j.expires_in||3600)*1000});return j.access_token}
    if(j.reconnect||j.error==='noacct'){renderConnections();throw Object.assign(new Error('reconnect '+acct),{reconnect:true,status:409})}
    if(j.signin){this.signedOut(j.reason);throw Object.assign(new Error('signin'),{signin:true})}
    throw Object.assign(new Error('offline'),{offline:true});
  },
  forget(acct){if(!acct||(this.user&&acct===this.user.email))this.tok=null;else this.toks.delete(acct)},
  connect(hint){location.href='/api/login?add=1'+(hint?'&hint='+encodeURIComponent(hint):'')},
  async disconnect(acct){try{const r=await fetch('/api/logout?acct='+encodeURIComponent(acct),{method:'POST',credentials:'same-origin'});const j=await r.json();if(j.accounts)this.accounts=j.accounts}catch(e){}
    this.accounts=this.accounts.filter(a=>a.email!==acct);this.toks.delete(acct);DRV.cache.clear();if(libView==='drive'&&driveView&&driveView.acct===acct)libSet('all');else renderShelf()},
  async init(){
    if(!this.avail()){dbGo();return true}
    const q=new URLSearchParams(location.search),sig=q.get('signin'),conn=q.get('connected');
    if(sig||conn)history.replaceState(null,'',location.pathname+location.hash);
    if(conn)setTimeout(()=>{toast('Connected '+conn+'. It’s under Connections in the sidebar.',4200)},1200);
    const j=await this.fetchToken();
    if(j.ok){this.mode='cloud';this.tok=j.access_token;this.exp=Date.now()+(j.expires_in||3600)*1000;this.setUser(j.user)}
    else if(j.signin||j.error){gateShow(sig&&sig!=='ok'?sig:j.error?'config':j.reason||'',q.get('email')||j.email,j.missing);return false}
    else if(j.net&&ls.get('inkleaf.acct',null)){this.mode='cloud';this.user=ls.get('inkleaf.acct',null)}   // offline: work here, sync later
    else this.mode='local';
    if(this.on){const sub=this.user.sub||this.user.email,owner=ls.get('inkleaf.dbOwner',null);if(!owner)ls.set('inkleaf.dbOwner',sub);
      DBNAME=!owner||owner===sub?'inkleaf':'inkleaf-'+String(sub).replace(/[^a-zA-Z0-9]/g,'');CS.on=true}
    dbGo();return true;
  },
  signedOut(reason){if(this.lost)return;this.lost=true;CS.setState('signin');gateShow(reason==='denied'?'denied':'expired',this.user&&this.user.email,null,true)},
  async login(hint){try{await Promise.all(panes.map(p=>p.flush()))}catch(e){}location.href='/api/login'+(hint?'?hint='+encodeURIComponent(hint):'')},
  async logout(){try{await Promise.all(panes.map(p=>p.flush()));await fetch('/api/logout',{method:'POST',credentials:'same-origin'})}catch(e){}ls.set('inkleaf.acct',null);location.replace('/')}
};
const MN_MARK=document.querySelector('.lbmark').innerHTML.replace(/mn(Sky|Back|Front|Clip)/g,'mg$1');
const GATE_MSG={cancelled:'Sign-in was cancelled.',expired:'Your sign-in has ended. Sign in again to keep your notebooks in sync.',error:'Google sign-in didn’t finish. Please try again.',
  noscope:'Mountain Notes needs permission to keep its files in your Google Drive. Sign in again and leave the Drive box ticked.',denied:'This Google account isn’t allowed to use this copy of Mountain Notes.',
  config:'Sign-in isn’t set up on the server yet. Add the settings from the setup guide in Vercel, then redeploy.'};
function gateShow(code,email,missing,over){
  let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';document.body.append(g)}
  let msg=GATE_MSG[code]||'';if(code==='denied'&&email)msg=`${esc(email)} isn’t allowed to use this copy of Mountain Notes.`;else msg=esc(msg);
  if(code==='config'&&missing&&missing.length)msg+=`<br><small>Missing: ${missing.map(esc).join(', ')}</small>`;
  g.innerHTML=`<div class="gwrap"><div class="glogo"><span class="gmark">${MN_MARK}</span><h1>Mountain Notes</h1></div>
    <button class="gbtn" id="gGo"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Sign in with Google</span></button>
    ${msg?`<p class="gmsg">${msg}</p>`:''}<p class="gnote">Your notebooks are kept in your own Google Drive and stay in sync on all your devices.</p></div>`;
  g.hidden=false;g.classList.toggle('over',!!over);
  $('#gGo').onclick=()=>CLOUD.login(code==='denied'?'':(email||(CLOUD.user&&CLOUD.user.email)||''));
}

/* ---------- Google Drive: hidden app folder ---------- */
const GDA={
  api:'https://www.googleapis.com/drive/v3',up:'https://www.googleapis.com/upload/drive/v3',
  async req(url,opt={},tries=0){
    const t=await CLOUD.token();let r;
    try{r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}})}
    catch(e){if(tries<2){await new Promise(z=>setTimeout(z,800*(tries+1)));return this.req(url,opt,tries+1)}throw Object.assign(new Error('offline'),{offline:true})}
    if(r.status===401&&tries<1){CLOUD.tok=null;return this.req(url,opt,tries+1)}
    if((r.status===429||r.status>=500||r.status===403)&&tries<4){let rate=r.status!==403;if(!rate){try{rate=/rate|quota/i.test(JSON.stringify(await r.clone().json()))}catch(e){}}
      if(rate){await new Promise(z=>setTimeout(z,(2**tries)*700+Math.random()*400));return this.req(url,opt,tries+1)}}
    if(!r.ok){let d='';try{d=(await r.text()).slice(0,300)}catch(e){}throw Object.assign(new Error('Drive '+r.status+' '+d),{status:r.status})}
    return r;
  },
  async list(){const out=[];let page='';
    do{const u=`${this.api}/files?spaces=appDataFolder&pageSize=1000&q=${encodeURIComponent('trashed = false')}&fields=${encodeURIComponent('nextPageToken,files(id,name,version,md5Checksum,size,appProperties)')}${page?'&pageToken='+encodeURIComponent(page):''}`;
      const j=await(await this.req(u)).json();out.push(...(j.files||[]));page=j.nextPageToken||''}while(page);return out},
  async version(id){try{const j=await(await this.req(`${this.api}/files/${id}?fields=version,md5Checksum`)).json();return{v:String(j.version),md5:j.md5Checksum||''}}catch(e){if(e.status===404)return null;throw e}},
  async get(id,as){const r=await this.req(`${this.api}/files/${id}?alt=media`);return as==='json'?r.json():r.text()},
  async del(id){try{await this.req(`${this.api}/files/${id}`,{method:'DELETE'})}catch(e){if(e.status!==404)throw e}},
  async put(id,name,body,mime,props){
    const meta=id?{appProperties:props}:{name,parents:['appDataFolder'],appProperties:props},f='&fields=id,version,md5Checksum';
    const blob=body instanceof Blob?body:new Blob([body],{type:mime});
    if(blob.size<4.5e6){const bd='inkleaf'+Math.random().toString(36).slice(2),head=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`;
      return(await this.req(`${this.up}/files${id?'/'+id:''}?uploadType=multipart${f}`,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:new Blob([head,blob,`\r\n--${bd}--`])})).json()}
    const s=await this.req(`${this.up}/files${id?'/'+id:''}?uploadType=resumable${f}`,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':mime,'X-Upload-Content-Length':String(blob.size)},body:JSON.stringify(meta)});
    const loc=s.headers.get('location');if(!loc)throw new Error('Drive upload session missing');
    return(await this.req(loc,{method:'PUT',headers:{'Content-Type':mime},body:blob})).json();
  }
};

/* ---------- sync ----------
   Each notebook becomes files in the app folder:
     meta~<id>     the notebook: title, folder, ink, pages, settings (everything except the note itself)
     html~<id>     the note (HTML, or the pages of an imported PDF) — uploaded only when it changes
     cfg~folders   your folder list
   A change here marks the notebook as waiting. Sync downloads what changed elsewhere, then uploads what changed here. */
const BIG_HTML=1.5e6;
const CS={
  on:false,E:new Map(),busy:false,again:false,t:0,state:'idle',last:0,err:'',prog:'',manual:false,
  get auto(){return ls.get('inkleaf.autoSync',false)},
  skey:()=>'inkleaf.cs:'+DBNAME,
  load(){if(this._l)return;this._l=1;const o=ls.get(this.skey(),null);this.E=new Map(o?Object.entries(o):[]);
    if(!ls.get('inkleaf.csInit:'+DBNAME,false)){for(const b of mem.values())this.mark(b.id);this.markCfg();ls.set('inkleaf.csInit:'+DBNAME,true)}},
  persist(){clearTimeout(this._pt);this._pt=setTimeout(()=>ls.set(this.skey(),Object.fromEntries(this.E)),200)},
  track:id=>id&&id!=='live-view'&&!String(id).startsWith('__'),
  touch(id){if(!this.on||!this.track(id))return;this.load();const k='meta~'+id,e=this.E.get(k)||{};e.d=1;e.del=0;e.hold=0;e.lc=(e.lc||0)+1;this.E.set(k,e);this.persist();this.soon();csPaintSoon()},
  touchDel(id){if(!this.on||!this.track(id))return;this.load();for(const k of['meta~'+id,'html~'+id]){const e=this.E.get(k);if(!e)continue;if(!e.fid){this.E.delete(k);continue}e.d=1;e.del=1;e.lc=(e.lc||0)+1}this.persist();this.soon();csPaintSoon()},
  markCfg(){if(!this.on)return;const e=this.E.get('cfg~folders')||{};e.d=1;e.lc=(e.lc||0)+1;this.E.set('cfg~folders',e);this.persist();this.soon()},
  mark(id){if(!this.track(id))return;const k='meta~'+id;if(this.E.has(k))return;this.E.set(k,{d:1,lc:1})},
  soon(ms=2500){if(!this.on||!this.auto)return;clearTimeout(this.t);this.t=setTimeout(()=>this.run(),ms)},
  kick(ms){clearTimeout(this.t);this.t=setTimeout(()=>this.run(),ms)},
  setState(s,err){this.state=s;if(err!==undefined)this.err=err;if(s==='done')this.last=Date.now();csPaint()},
  untouched:b=>!b||(b.sample&&(b.updated||0)<=(b.created||0)+1000)||(b.sys&&!(b.elements||[]).length),

    }catch(e){L.innerHTML=`<div class="gi"><span class="gtx" style="color:var(--danger)">Couldn’t open Drive: ${esc(String(e.message||e).slice(0,100))}</span></div>`}
  };draw();
}
function renderConnections(){
  const sec=$('#connSec'),nav=$('#navConn');if(!sec)return;sec.hidden=!CS.on;if(!CS.on){nav.innerHTML='';return}
  const accts=driveAccts();
  nav.innerHTML=accts.map(a=>`<button class="nitem${libView==='drive'&&driveView&&driveView.acct===a.email?' on':''}" data-acct="${esc(a.email)}" type="button">${ic('M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z')}<span class="nl"></span></button>`).join('')
    +`<button class="nitem add" id="connAdd2" type="button">${ic('M12 5v14M5 12h14')}<span class="nl">Add Google Drive</span></button>`;
  nav.querySelectorAll('[data-acct]').forEach((x,i)=>{x.querySelector('.nl').textContent=accts[i].email;x.onclick=()=>driveOpen({acct:accts[i].email,id:'root',path:[]})});
  $('#connAdd2').onclick=$('#connAdd').onclick=()=>CLOUD.connect();
}
function driveAcctMenu(anchor){
  const v=driveView;if(!v)return;const a=driveAccts().find(x=>x.email===v.acct);
  lpop(anchor,[{label:'Refresh',icon:'M20 11a8 8 0 0 0-14.3-4.9L4 8M4 3v5h5',run:()=>{DRV.cache.clear();renderShelf()}},

}

];
const ICON_PACKS=[['line','Line'],['thin','Thin'],['bold','Bold'],['duotone','Duotone'],['tiles','Tiles'],['sketch','Sketch']];
const THEME=Object.assign({pal:'mountain',mode:'auto',icons:'line'},ls.get('mn.theme',{}));
(()=>{const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
  const DARK={bg:'#13151b',surface:'#1c1f28','surface-2':'#252935',fg:'#e8eaf1',muted:'#9ba2b6',line:'#323747',stage:'#0d0f14','accent-ink':'#0d1222',danger:'#ff7a70',ok:'#5fd39a'};
  const vars=(o,dark)=>Object.entries(dark?{...DARK,...o}:o).map(([k,v])=>`--${k}:${v}`).join(';')+(o.accent?`;--accent-soft:${hexA(o.accent,dark?.22:.12)}`:'');
  let css='';for(const[id,,L,D]of THEMES){css+=`:root[data-pal="${id}"]{${vars(L)}}\n@media (prefers-color-scheme: dark){:root[data-pal="${id}"]:not([data-theme="light"]){${vars(D,true)}}}\n:root[data-pal="${id}"][data-theme="dark"]{${vars(D,true)}}\n`}
  const st=document.createElement('style');st.id='themeCss';st.textContent=css;document.head.append(st)})();
function applyTheme(){const r=document.documentElement;r.dataset.pal=THEME.pal;r.dataset.icons=THEME.icons;if(THEME.mode==='auto')delete r.dataset.theme;else r.dataset.theme=THEME.mode;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue('--surface').trim()||m.content}
applyTheme();
function themeSheet(){
  const prev=d=>`<svg class="icon" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  const sample=['M6 3h9l4 4v14H6z','M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z','M3 6h6l2 2h10v11H3z','M4 20h4L19 9l-4-4L4 16zM13 7l4 4'];
  const s=modal({title:'Appearance',body:`<div class="appear">
    <div class="glbl">Colour theme</div><div class="thgrid" id="thGrid">${THEMES.map(([id,label,L])=>`<button data-t="${id}" type="button" aria-pressed="${THEME.pal===id}"><span class="thsw" style="background:${L.bg||'#eceef3'}"><b style="background:${L.surface||'#ffffff'}"></b><i style="background:${L.accent}"></i></span><span class="thl">${label}</span></button>`).join('')}</div>
    <div class="glbl">Light or dark</div><div class="seg" id="thMode"><button data-v="auto" type="button">Automatic</button><button data-v="light" type="button">Light</button><button data-v="dark" type="button">Dark</button></div>
    <div class="glbl">Icon pack</div><div class="icgrid" id="icGrid">${ICON_PACKS.map(([id,label])=>`<button data-i="${id}" type="button" aria-pressed="${THEME.icons===id}"><span class="icprev" data-icons="${id}">${sample.map(prev).join('')}</span><span class="thl">${label}</span></button>`).join('')}</div></div>`,actions:[{label:'Done',primary:true}]});
  const set=()=>{ls.set('mn.theme',THEME);applyTheme()};
  s.querySelectorAll('#thGrid button').forEach(b=>b.onclick=()=>{THEME.pal=b.dataset.t;set();s.querySelectorAll('#thGrid button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  s.querySelectorAll('#thMode button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===THEME.mode);b.onclick=()=>{THEME.mode=b.dataset.v;set();s.querySelectorAll('#thMode button').forEach(x=>x.setAttribute('aria-pressed',x===b))}});
  s.querySelectorAll('#icGrid button').forEach(b=>b.onclick=()=>{THEME.icons=b.dataset.i;set();s.querySelectorAll('#icGrid button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
}
